name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ruff
        run: pipx run ruff==0.17.4 check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the map
        run: python scripts/build.py
      - name: Committed parking.geojson matches a fresh build
        run: git diff --exit-code --stat -- data/parking.geojson
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript tests
        run: node --test tests/hours.test.js

      - name: Upload the built map
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: free-curb-atl-map
          path: dist/index.html

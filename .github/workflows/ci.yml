name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ruff
        run: pipx run ruff==0.17.4 check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the map
        run: python scripts/build.py
      - name: Committed parking.geojson matches a fresh build
        run: git diff --exit-code --stat -- data/parking.geojson
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript tests
        run: node --test tests/hours.test.js

      - name: Upload the built map
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: free-curb-atl-map
          path: dist/index.html

  deploy:
    # Publish the map to GitHub Pages: only from main, only after lint and tests pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the site
        run: |
          python scripts/build.py
          mkdir -p _site
          cp dist/index.html _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
